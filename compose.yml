name: ekumidayomi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      EKUMIDAYOMI_APP_ENV: development
      EKUMIDAYOMI_DATABASE_URL: postgresql+asyncpg://ekumidayomi:development-only@postgres:5432/ekumidayomi
      EKUMIDAYOMI_TEST_DATABASE_URL: postgresql+asyncpg://ekumidayomi:test-only@postgres-test:5432/ekumidayomi_test
      EKUMIDAYOMI_REDIS_URL: redis://redis:6379/0
      EKUMIDAYOMI_ALLOWED_HOSTS: '["localhost","127.0.0.1","app","testserver"]'
      EKUMIDAYOMI_CORS_ORIGINS: '["http://localhost:3000"]'
      EKUMIDAYOMI_SECRET_KEY: development-only-change-me
      RUN_MIGRATIONS_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ekumidayomi
      POSTGRES_USER: ekumidayomi
      POSTGRES_PASSWORD: development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekumidayomi -d ekumidayomi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ekumidayomi_test
      POSTGRES_USER: ekumidayomi
      POSTGRES_PASSWORD: test-only
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekumidayomi -d ekumidayomi_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-test-data:
  redis-data:
