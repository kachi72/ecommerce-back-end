name: Container smoke test

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-smoke.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "compose.yml"
      - "src/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and start the production container stack
        run: >-
          docker compose up
          --build
          --wait
          --wait-timeout 120
          --detach
          postgres redis app
      - name: Check liveness
        run: curl --fail --show-error --silent http://localhost:8000/health/live
      - name: Check readiness
        run: curl --fail --show-error --silent http://localhost:8000/health/ready
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down the smoke-test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
