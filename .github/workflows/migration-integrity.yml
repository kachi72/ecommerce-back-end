name: Migration integrity

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migration-integrity.yml"
      - "migrations/**"
      - "src/ekumidayomi/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-integrity:
    name: Migration integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ekumidayomi_migrations
          POSTGRES_USER: ekumidayomi
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekumidayomi -d ekumidayomi_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EKUMIDAYOMI_APP_ENV: test
      EKUMIDAYOMI_DATABASE_URL: postgresql+asyncpg://ekumidayomi:ci-only@localhost:5432/postgres
      EKUMIDAYOMI_TEST_DATABASE_URL: postgresql+asyncpg://ekumidayomi:ci-only@localhost:5432/ekumidayomi_migrations
      EKUMIDAYOMI_REDIS_URL: redis://localhost:6379/0
      EKUMIDAYOMI_SECRET_KEY: ci-only-secret
      EKUMIDAYOMI_ALLOWED_HOSTS: '["testserver"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.8"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --group dev
      - name: Require exactly one Alembic head
        run: test "$(uv run alembic heads | grep -c '(head)')" -eq 1
      - name: Upgrade a clean database
        run: uv run alembic upgrade head
      - name: Confirm the database is at head
        run: uv run alembic current --check-heads
      - name: Detect model drift
        run: uv run alembic check
